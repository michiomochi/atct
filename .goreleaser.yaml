version: 2

before:
  hooks:
    - sh -c "cd web && pnpm install --frozen-lockfile"
    - sh -c "cd web && pnpm build"

builds:
  - id: atct
    main: ./cmd/atct
    binary: atct
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: atct-mcp
    main: ./cmd/atct-mcp
    binary: atct-mcp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: true

homebrew_casks:
  - name: atct
    repository:
      owner: michiomochi
      name: homebrew-tap
    homepage: "https://github.com/michiomochi/atct"
    description: "The air traffic control tower for your coding agents"
    license: "AGPL-3.0"
    binaries: [atct, atct-mcp]
    # `url.verified` and `postflight` are both deprecated in Homebrew.
    # postflight_steps takes a restricted step DSL, which goreleaser cannot
    # emit from `hooks`, so it is written through custom_block.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atct"]
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atct-mcp"]
        end
      end
