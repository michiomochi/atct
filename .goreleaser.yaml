version: 2

builds:
  - id: atct
    main: ./cmd/atct
    binary: atct
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: atct-mcp
    main: ./cmd/atct-mcp
    binary: atct-mcp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: true

# Homebrew cask. `brews` is deprecated since v2.16; casks are the supported way
# to ship pre-compiled binaries. The tap repository must exist before a release
# runs, because GoReleaser pushes the generated cask into it.
homebrew_casks:
  - name: atct
    repository:
      owner: michiomochi
      name: homebrew-tap
    homepage: "https://github.com/michiomochi/atct"
    description: "The air traffic control tower for your coding agents"
    license: "AGPL-3.0"
    # Helps `brew audit` when the homepage and the download host differ.
    url:
      verified: github.com/michiomochi/atct
    hooks:
      post:
        # The binaries are not signed or notarized, so macOS quarantines them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atct"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atct-mcp"]
          end
