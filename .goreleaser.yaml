version: 2

before:
  hooks:
    - sh -c "cd web && pnpm install --frozen-lockfile"
    - sh -c "cd web && pnpm build"

builds:
  - id: atct
    main: ./cmd/atct
    binary: atct
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: atct-mcp
    main: ./cmd/atct-mcp
    binary: atct-mcp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: true

homebrew_casks:
  - name: atct
    repository:
      owner: michiomochi
      name: homebrew-tap
    homepage: "https://github.com/michiomochi/atct"
    description: "The air traffic control tower for your coding agents"
    license: "AGPL-3.0"
    binaries: [atct, atct-mcp]
    # `postflight` is deprecated, but postflight_steps runs a restricted DSL
    # whose `base:` selects the command path only, leaving `args` relative:
    # 0.63.5 failed to install with `xattr: No such file: atct`. Keep the
    # working hook and take the deprecation warning until goreleaser emits
    # postflight_steps itself.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atct"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atct-mcp"]
          end
